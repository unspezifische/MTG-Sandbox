user nginx;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream mtg_backend {
    server backend:5000;
  }

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location = /api {
      return 301 /api/;
    }

    location /api/ {
      proxy_pass http://mtg_backend/api/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    #
    # Dev image fallback:
    # Proxy local-style image URLs to Scryfall CDN.
    #
    # Example frontend URL:
    # /card-images/small/front/a/8/a8755662-b329-4c5b-8bf7-c9e1702e5979.jpg
    #
    location /card-images/ {
      resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

      proxy_ssl_server_name on;
      proxy_set_header Host cards.scryfall.io;

      proxy_pass https://cards.scryfall.io/;
      proxy_http_version 1.1;

      add_header Cache-Control "public, max-age=86400";
      access_log /var/log/nginx/card_images_access.log;
      error_log /var/log/nginx/card_images_error.log;
    }

    error_log /var/log/nginx/app_error.log;
    access_log /var/log/nginx/app_access.log;
  }
}